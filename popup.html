<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Tab</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap');

    :root {
      --bg: #1a1410;
      --surface: #231d17;
      --border: #3a2f24;
      --accent: #e8623a;
      --accent2: #f0a87a;
      --text: #f2ede8;
      --muted: #8a7c6e;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 260px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      padding: 24px 20px 20px;
      overflow: hidden;
    }

    /* Decorative top bar */
    .top-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot:nth-child(1) {
      background: #e05a4a;
    }

    .dot:nth-child(2) {
      background: #e0b44a;
    }

    .dot:nth-child(3) {
      background: #4aad6e;
    }

    /* Tomato icon */
    .icon-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    .tomato {
      font-size: 36px;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(232, 98, 58, 0.45));
    }

    /* Title */
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 300;
      font-style: italic;
      font-size: 22px;
      text-align: center;
      letter-spacing: 0.01em;
      color: var(--text);
      margin-bottom: 6px;
    }

    h1 span {
      color: var(--accent);
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 14px 0;
    }

    /* Timer */
    .timer-wrap {
      text-align: center;
      margin-bottom: 4px;
    }

    #session-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    #timer-display {
      font-size: 42px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1;
      transition: color 0.4s ease;
    }

    #timer-display.break {
      color: var(--accent2);
    }

    /* Progress bar */
    .progress-track {
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px 0 14px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 1s linear, background 0.4s ease;
    }

    #progress-bar.break {
      background: var(--accent2);
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    button {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      padding: 7px 18px;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    #btn-start {
      background: var(--accent);
      color: #fff;
      flex: 1;
    }

    #btn-start:hover {
      opacity: 0.85;
    }

    #btn-reset {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    #btn-reset:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    /* ── NEW: Hard Mode toggle ── */
    .hard-mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .hard-mode-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hard-mode-label span:first-child {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
    }

    .hard-mode-label span:last-child {
      font-size: 10px;
      color: var(--muted);
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 32px;
      height: 18px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 18px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .toggle-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .toggle input:checked+.toggle-track {
      background: var(--accent);
    }

    .toggle input:checked+.toggle-track::after {
      transform: translateX(14px);
      background: #fff;
    }

    /* Status row */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }

    #status {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4aad6e;
      transition: opacity 0.4s ease;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Footer */
    .tag {
      margin-top: 14px;
      text-align: center;
      font-size: 10px;
      color: var(--border);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="icon-wrap">
    <span class="tomato">🍅</span>
  </div>

  <h1>Pomodoro <span>Tab</span></h1>

  <div class="divider"></div>

  <div class="timer-wrap">
    <div id="session-label">Work Session</div>
    <div id="timer-display">25:00</div>
  </div>

  <div class="progress-track">
    <div id="progress-bar"></div>
  </div>

  <div class="btn-row">
    <button id="btn-start">Start</button>
    <button id="btn-reset">Reset</button>
  </div>

  <!-- Hard Mode toggle (new) -->
  <div class="hard-mode-row">
    <div class="hard-mode-label">
      <span>Hard Mode</span>
      <span>Lock tab while timer runs</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="hard-mode-checkbox" />
      <div class="toggle-track"></div>
    </label>
  </div>

  <div class="status-row">
    <div id="status"></div>
    <span class="status-text" id="status-text">Ready</span>
  </div>

  <p class="tag">Focus · Rest · Repeat</p>

  <script src="popup.js"></script>
</body>

</html>
